<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Pool Chip Tournament</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap">
<style id="css">
/* Layout: one calm column. One view at a time (Tables / Standings / History); settings tucked behind one button.
   Palette from the reference: navy ground, slate cards, peach only for chips and the main action. */
:root{
  --bg:#171c2f; --surface:#262b47; --surface-2:#2d3250; --raised:#3b4064; --ink:#ffffff; --muted:#b3b8db;
  --accent:#f9b17a; --accent-ink:#262b47; --accent-text:#f9b17a; --accent-soft:#45405a;
  --chip:#f9b17a; --chip-empty:#4a5078;
  --win:#5cc98f; --win-ink:#0f2a1d; --win-soft:#26474a;
  --danger:#ff8d9b; --danger-ink:#3a1520;
  --veil:rgba(23,28,47,.45);
  --f:"Raleway","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:16px; --rb:10px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f1f2f8; --surface:#ffffff; --surface-2:#f6f7fb; --raised:#e7e9f3; --ink:#1d2238; --muted:#525985;
  --accent:#f9b17a; --accent-ink:#2d3250; --accent-text:#a85a1f; --accent-soft:#fdeadb;
  --chip:#f39a55; --chip-empty:#d3d7e6;
  --win:#1f9a5a; --win-ink:#ffffff; --win-soft:#d9f2e4;
  --danger:#b3263b; --danger-ink:#ffffff;
  --veil:rgba(241,242,248,.5); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f1f2f8; --surface:#ffffff; --surface-2:#f6f7fb; --raised:#e7e9f3; --ink:#1d2238; --muted:#525985;
  --accent:#f9b17a; --accent-ink:#2d3250; --accent-text:#a85a1f; --accent-soft:#fdeadb;
  --chip:#f39a55; --chip-empty:#d3d7e6;
  --win:#1f9a5a; --win-ink:#ffffff; --win-soft:#d9f2e4;
  --danger:#b3263b; --danger-ink:#ffffff;
  --veil:rgba(241,242,248,.5); color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.5;font-variant-numeric:lining-nums;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:background-color .15s ease-out,color .15s ease-out,transform .1s ease-out}
button:active:not(:disabled){transform:scale(.98)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-block:32px 64px;padding-inline:20px;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{margin:0;text-wrap:balance}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.ttl{min-width:0}
h1{font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1.1;letter-spacing:-.02em}
.sub{margin:6px 0 0;color:var(--muted);font-size:16px;font-weight:500}
.btn{border:0;background:var(--raised);border-radius:var(--rb);padding:10px 18px;font-weight:700;min-height:46px;flex:none}
.btn:hover:not(:disabled){background:color-mix(in srgb,var(--raised) 85%,var(--ink))}
.btn.primary,.btn.chalk{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled),.btn.chalk:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 88%,#fff)}
.btn.danger{background:var(--danger);color:var(--danger-ink)}
.btn.small{min-height:40px;padding:8px 14px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;padding:4px 0;color:var(--accent-text);font-weight:600;font-size:15px;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;align-self:flex-start}
.link:hover{color:var(--ink)}
.link.danger{color:var(--danger)}
.link.quiet{color:var(--muted);text-decoration:none;font-weight:600}
.link.quiet:hover{color:var(--danger)}
.flash{padding:14px 16px;border-radius:var(--rb);background:var(--accent-soft);font-weight:600}
.hint{color:var(--muted);font-size:15px}
.lead{margin:0}
/* tabs */
.tabs{display:flex;background:var(--surface);border-radius:999px;padding:5px;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{flex:1;border:0;background:none;border-radius:999px;padding:10px 8px;font-weight:700;color:var(--muted);min-height:46px;font-size:16px}
.tabs button.on{background:var(--ink);color:var(--bg)}
.body{display:flex;flex-direction:column;gap:16px}
/* tables */
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.tcard{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.thead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.thead h3{font-size:22px;font-weight:800;letter-spacing:-.01em}
.tm{font-size:15px;color:var(--muted);font-weight:500;white-space:nowrap}
.tm .link{font-size:15px;padding:0}
.cm{display:inline-flex;gap:12px}
.tcard.open{background:transparent;padding:14px 18px;gap:8px;outline:2px dashed var(--raised);outline-offset:-2px}
.tcard.open h3{color:var(--muted)}
.open-msg{margin:0;color:var(--muted)}
.pbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;background:var(--raised);border-radius:var(--rb);padding:14px 16px;min-height:64px}
.pbtn:not(:disabled):hover{background:color-mix(in srgb,var(--raised) 82%,var(--ink))}
.pbtn.sel{background:var(--win-soft);color:var(--ink);animation:winflash 3s ease-out both}
@keyframes winflash{0%,60%{background:var(--win);color:var(--win-ink)}100%{background:var(--win-soft);color:var(--ink)}}
.pbtn.sel .chip{background:var(--chip)}.pbtn.sel .chip.gone{background:color-mix(in srgb,var(--ink) 18%,transparent)}
.pbtn.lose{opacity:.5}
.pbtn:disabled{cursor:default;opacity:1}
.pname{font-weight:700;font-size:19px;min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.wtag{font-size:13px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--win);color:var(--win-ink)}
.vs{font-weight:600;color:var(--muted);font-size:14px;text-align:center;line-height:1}
.chips{display:inline-flex;flex-wrap:wrap;gap:5px;align-items:center;flex:none}
.chip{width:14px;height:14px;border-radius:50%;background:var(--chip)}
.chip.gone{background:var(--chip-empty)}
.chipnum{font-weight:800;font-size:22px;color:var(--accent-text)}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--accent-soft);border-radius:var(--rb);padding:12px 14px;margin-top:4px}
.confirm p{margin:0;flex:1 1 160px;font-weight:600}
.waiting{margin:4px 0 0;color:var(--ink)}
.waiting span{color:var(--muted);font-weight:600;margin-right:10px}
.result{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--rb);background:var(--win);color:var(--win-ink);font-weight:600;animation:resultfade 3s ease-out both}
.result b{font-weight:800}
.result .tick{width:22px;height:22px;flex:none}
@keyframes resultfade{0%,80%{opacity:1}100%{opacity:0}}
/* lists */
.list{list-style:none;margin:0;padding:6px;background:var(--surface);border-radius:var(--r);display:flex;flex-direction:column;gap:2px}
.list li{border-radius:var(--rb)}
.list li.open{background:var(--surface-2)}
.rowbtn{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:14px 12px;text-align:left;border-radius:var(--rb);min-height:56px}
button.rowbtn:hover{background:var(--surface-2)}
.rank{width:20px;flex:none;font-weight:800;color:var(--muted);font-size:16px}
.srow:first-child .rank{color:var(--accent-text)}
.sname{flex:1;min-width:0;font-weight:700;font-size:18px;overflow-wrap:anywhere}
.sstat{color:var(--muted);font-size:15px;font-weight:600;white-space:nowrap}
.srow.out .sname{color:var(--muted);font-weight:600}
.h-out{font-size:18px;color:var(--muted);margin-top:8px}
.lrow .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.lrow .txt b{font-weight:800}
.lrow.void .txt{text-decoration:line-through;color:var(--muted)}
.edit{padding:0 12px 14px;display:flex;flex-direction:column;gap:10px}
.edit .hint{margin:0}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.list .confirm{margin:0 8px 10px}
.more{margin-top:4px}
.empty{padding:28px;color:var(--muted);text-align:center;background:var(--surface);border-radius:var(--r);margin:0}
/* settings */
.sheet{background:var(--surface);border-radius:var(--r);padding:8px 20px 20px;display:flex;flex-direction:column;gap:6px}
.srow2{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;font-weight:600}
.sel{width:auto;min-height:44px}
.note{font-size:15px;color:var(--muted);margin:8px 0}
/* setup */
.setup{display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card h2,.sec-head h2{font-size:24px;font-weight:800}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px;color:var(--muted)}
.in{border:0;border-left:3px solid transparent;background:var(--raised);border-radius:4px;padding:10px 12px;min-height:48px;width:100%;color:var(--ink)}
.in:focus{outline:0;border-left-color:var(--accent)}
.in::placeholder{color:var(--muted)}
textarea.in{min-height:120px;resize:vertical}
.stepper{display:inline-flex;align-items:center;border-radius:var(--rb);overflow:hidden;background:var(--raised);flex:none}
.stepper button{border:0;background:none;width:44px;height:46px;font-size:20px;font-weight:700;color:var(--accent-text)}
.stepper button:hover:not(:disabled){background:color-mix(in srgb,var(--raised) 85%,var(--ink))}
.stepper button:disabled{color:var(--muted);opacity:.4;cursor:not-allowed}
.stepper output{min-width:28px;text-align:center;font-weight:800;font-size:20px}
.pace{display:grid;gap:8px}
.pace label{display:flex;gap:12px;align-items:flex-start;border-radius:var(--rb);padding:12px 14px;background:var(--raised);cursor:pointer}
.pace label.on{background:var(--accent-soft)}
.pace input{margin-top:5px;accent-color:var(--accent)}
.pace b{display:block}
.pace small{color:var(--muted);font-size:15px}
.prow{display:flex;gap:8px;align-items:center}
.prow .in{flex:1;min-width:0}
.xbtn{border:0;background:var(--raised);border-radius:var(--rb);width:46px;height:46px;flex:none;color:var(--muted);font-size:20px}
.xbtn:hover{color:var(--danger)}
.plist{display:flex;flex-direction:column;gap:8px}
.card .note{color:var(--ink);background:var(--surface-2);border-radius:var(--rb);padding:12px 14px;margin:0}
.note.ex{background:var(--accent-soft)}
.rowflex{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.winner{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:26px 24px;display:flex;flex-direction:column;gap:6px}
.winner h2{font-size:clamp(36px,8vw,60px);line-height:1;font-weight:800;letter-spacing:-.03em}
.winner p{margin:0;font-weight:600;font-size:17px}
.seg{display:inline-flex;background:var(--raised);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-size:15px;font-weight:600;color:var(--muted);min-height:36px}
.seg button.on{background:var(--ink);color:var(--bg)}
.saving-veil{position:fixed;inset:0;background:var(--veil);z-index:20;cursor:progress}
@media (max-width:520px){.tables{grid-template-columns:1fr}.wrap{padding-block:24px 48px;gap:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div id="root"></div>
<script type="application/json" id="tstate">{"v":1,"title":"Pool Chip Tournament","tables":2,"leadLimit":2,"phase":"setup","players":[],"matches":[],"adj":[],"seq":0,"endSeq":0,"blocked":[],"updatedAt":0}</script>
<script id="app">
(function(){
"use strict";
var RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
var FONTS='https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap';
var LS_STATE='pct.state.v1', LS_DRAFT='pct.draft.v1', SS_UI='pct.ui.v1';
var root=document.getElementById('root');

function lsGet(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function clone(o){return JSON.parse(JSON.stringify(o))}
function h(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rnd(){try{var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296}catch(e){return Math.random()}}
function uid(){return 'p'+Math.floor(rnd()*1e9).toString(36)+Date.now().toString(36).slice(-4)}

function blankState(){return {v:1,title:'Pool Chip Tournament',tables:2,leadLimit:2,phase:'setup',players:[],matches:[],adj:[],seq:0,endSeq:0,blocked:[],updatedAt:0}}
var S=null;
try{S=JSON.parse(document.getElementById('tstate').textContent)}catch(e){}
if(!S||!S.v)S=blankState();

var mode='connecting'; // connecting | shared | local | readonly
var art=null, saving=false, flash=null;
var ui={tab:'tables',pending:null,edit:null,confirm:null,histAll:false,last:null};
try{var su=JSON.parse(sessionStorage.getItem(SS_UI)||'null');if(su){ui.tab=su.tab||'tables';flash=su.flash||null;if(su.last){ui.last=su.last;ui.last.at=Date.now()}sessionStorage.removeItem(SS_UI)}}catch(e){}

/* theme: auto follows the device; light/dark is remembered on this device */
var LS_THEME='pct.theme', hostTheme=document.documentElement.getAttribute('data-theme');
var theme=lsGet(LS_THEME)||'auto';
function applyTheme(){
  var r=document.documentElement;
  if(theme==='light'||theme==='dark')r.setAttribute('data-theme',theme);
  else if(hostTheme)r.setAttribute('data-theme',hostTheme);
  else r.removeAttribute('data-theme');
}
applyTheme();

var EXAMPLES=[['Marcus',2],['Tasha',3],['Dev',3],['Rosa',4],['Kenji',2],['Lena',4],['Omar',3],['Priya',4]];
var draft=lsGet(LS_DRAFT);
if(!draft||!draft.players){draft={title:'Friday Chip Tournament',tables:2,leadLimit:2,example:true,players:EXAMPLES.map(function(x){return {id:uid(),name:x[0],chips:x[1]}})}}
function saveDraft(){lsSet(LS_DRAFT,draft)}

function viewMode(){return location.hash==='#view'||mode==='readonly'||mode==='connecting'}
function canAct(){return (mode==='shared'||mode==='local')&&location.hash!=='#view'&&!saving}

/* ---------- derived state ---------- */
function derive(st){
  var P={},list=[];
  st.players.forEach(function(p){var o=Object.assign({},p,{losses:0,wins:0,played:0,adjust:0,lastOpp:null,lastEnd:-1,vs:{},busy:null,table:null});P[p.id]=o;list.push(o)});
  st.matches.forEach(function(m){if(m.status==='live'){if(P[m.a]){P[m.a].busy=m.id;P[m.a].table=m.table}if(P[m.b]){P[m.b].busy=m.id;P[m.b].table=m.table}}});
  st.matches.filter(function(m){return m.status==='done'}).sort(function(x,y){return x.endedSeq-y.endedSeq}).forEach(function(m){
    var w=m.winner,l=w===m.a?m.b:m.a;
    if(!P[w]||!P[l])return;
    P[w].wins++;P[l].losses++;
    [[m.a,m.b],[m.b,m.a]].forEach(function(pr){var x=P[pr[0]];x.played++;x.lastOpp=pr[1];x.lastEnd=m.endedSeq;x.vs[pr[1]]=(x.vs[pr[1]]||0)+1});
  });
  (st.adj||[]).forEach(function(a){if(P[a.player])P[a.player].adjust+=a.delta});
  list.forEach(function(p){p.cur=Math.max(0,p.chips-p.losses+p.adjust);p.alive=p.cur>0&&!p.withdrawn});
  var alive=list.filter(function(p){return p.alive});
  var active=alive.filter(function(p){return !p.away});
  var minPlayed=active.length?Math.min.apply(null,active.map(function(p){return p.played})):0;
  return {S:st,P:P,list:list,alive:alive,active:active,minPlayed:minPlayed};
}

/* ---------- the draw ---------- */
function pickPair(d,force){
  var idle=d.active.filter(function(p){return !p.busy});
  if(idle.length<2)return {reason:'few'};
  var pool=idle;
  if(!force&&d.S.leadLimit<99){
    pool=idle.filter(function(p){return p.played-d.minPlayed<d.S.leadLimit});
    if(pool.length<2)return {reason:'lead'};
  }
  var key={};pool.forEach(function(p){key[p.id]=rnd()});
  var order=pool.slice().sort(function(x,y){return x.played-y.played||x.lastEnd-y.lastEnd||key[x.id]-key[y.id]});
  for(var i=0;i<order.length;i++){
    var first=order[i];
    var opps=pool.filter(function(p){return p.id!==first.id&&p.id!==first.lastOpp});
    if(!opps.length)continue;
    var k2={};opps.forEach(function(p){k2[p.id]=rnd()});
    opps.sort(function(x,y){return x.played-y.played||(first.vs[x.id]||0)-(first.vs[y.id]||0)||x.lastEnd-y.lastEnd||k2[x.id]-k2[y.id]});
    return {pair:rnd()<.5?[first.id,opps[0].id]:[opps[0].id,first.id]};
  }
  if(force||d.active.length<=2)return {pair:[order[0].id,order[1].id]};
  return {reason:'rematch',names:[order[0].name,order[1].name]};
}
function fill(st,forceTable){
  st.blocked=[];
  for(var t=1;t<=st.tables;t++){
    if(st.matches.some(function(m){return m.status==='live'&&m.table===t}))continue;
    var r=pickPair(derive(st),forceTable===t);
    if(!r.pair){st.blocked.push({table:t,reason:r.reason,names:r.names||null});continue}
    st.seq++;
    st.matches.push({id:'m'+st.seq,n:st.seq,a:r.pair[0],b:r.pair[1],table:t,status:'live',winner:null,startedAt:Date.now(),endedSeq:null,endedAt:null});
  }
}
function normalize(st,forceTable){
  if(st.phase==='setup')return st;
  var d=derive(st);
  st.matches.forEach(function(m){if(m.status==='live'&&(!d.P[m.a].alive||!d.P[m.b].alive)){m.status='void';m.note='Cancelled: a player is out after a correction'}});
  d=derive(st);
  if(d.alive.length<=1){
    st.matches.forEach(function(m){if(m.status==='live'){m.status='void';m.note='Cancelled: tournament finished'}});
    st.phase='done';st.blocked=[];return st;
  }
  st.phase='running';
  fill(st,forceTable);
  return st;
}

/* ---------- saving ---------- */
function renderDoc(st){
  var css=document.getElementById('css').textContent;
  var app=document.getElementById('app').textContent;
  var json=JSON.stringify(st).replace(/</g,'\\u003c');
  var SC='<'+'/script>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    '<title>Pool Chip Tournament</title>\n<link rel="stylesheet" href="'+FONTS+'">\n'+
    '<style id="css">'+css+'</style>\n<div id="root"></div>\n'+
    '<script type="application/json" id="tstate">'+json+SC+'\n'+
    '<script id="app">'+app+SC+'</body></html>';
}
function stashUI(msg){try{sessionStorage.setItem(SS_UI,JSON.stringify({tab:ui.tab,flash:msg||null,last:msg?null:ui.last}))}catch(e){}}
function commit(next,attempt){
  if(saving&&!attempt)return;
  next.updatedAt=Date.now();
  ui.pending=null;ui.confirm=null;
  if(mode==='local'){S=next;lsSet(LS_STATE,S);flash=null;render();return}
  if(mode!=='shared')return;
  saving=true;render();
  stashUI(null);
  art.publish(renderDoc(next)).then(function(){S=next;saving=false;flash=null;render()},function(e){
    var c=e&&e.code;saving=false;
    if(c==='conflict'){flash='Another device saved first. Loading the latest version, so check the tables before entering this again.';stashUI(flash)}
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='capability_removed'||c==='not_declared'){mode='readonly';flash='This is a read-only view. Only the tournament director can enter results.'}
    else if(c==='rate_limited'){flash='Saving too quickly. Wait a few seconds, then try again.'}
    else if(!attempt&&(c==='upstream_error'||!c)){saving=true;render();setTimeout(function(){commit(next,1)},600+rnd()*900);return}
    else{flash='Could not save ('+(c||'unknown error')+'). Try again.'}
    render();
  });
}

/* ---------- actions ---------- */
function act(name,el){
  var ds=el.dataset, st;
  switch(name){
    case 'tab':ui.tab=ds.v;render();break;
    case 'pick':if(!canAct())return;if(!(ui.pending&&ui.pending.m===ds.m&&ui.pending.w===ds.w))ui.pending={m:ds.m,w:ds.w,at:Date.now()};render();break;
    case 'unpick':ui.pending=null;ui.confirm=null;render();break;
    case 'win':
      st=clone(S);var m=st.matches.find(function(x){return x.id===ds.m});
      if(!m||m.status!=='live'){flash='That match was already scored.';render();return}
      m.status='done';m.winner=ds.w;st.endSeq=(st.endSeq||0)+1;m.endedSeq=st.endSeq;m.endedAt=Date.now();
      var dd=derive(st),Wp=dd.P[ds.w],Lp=dd.P[ds.w===m.a?m.b:m.a];
      ui.last={w:Wp.name,l:Lp.name,table:m.table,left:Lp.cur,at:Date.now()};
      commit(normalize(st));break;
    case 'settings':ui.settings=!ui.settings;ui.confirm=null;render();break;
    case 'editM':ui.edit=ui.edit===ds.m?null:ds.m;ui.confirm=null;render();break;
    case 'theme':theme=ds.v;lsSet(LS_THEME,theme);applyTheme();render();break;
    case 'ask':ui.confirm=ds.v;render();break;
    case 'cancelMatch':
      st=clone(S);m=st.matches.find(function(x){return x.id===ds.m});
      if(!m||m.status!=='live')return;
      m.status='void';m.note='Cancelled before a result';
      // Free table stays open until the director starts it again, so the same pair is not instantly redrawn.
      st.blocked=st.blocked||[];
      commit(normalize(st,-1));break;
    case 'force':st=clone(S);commit(normalize(st,+ds.t));break;
    case 'flip':
      st=clone(S);m=st.matches.find(function(x){return x.id===ds.m});
      if(!m||m.status!=='done')return;
      m.winner=m.winner===m.a?m.b:m.a;m.note='Winner corrected';
      commit(normalize(st));break;
    case 'voidRes':
      st=clone(S);m=st.matches.find(function(x){return x.id===ds.m});
      if(!m||m.status!=='done')return;
      m.status='void';m.note='Result removed';
      commit(normalize(st));break;
    case 'editP':ui.edit=ui.edit===ds.p?null:ds.p;ui.confirm=null;render();break;
    case 'adj':
      st=clone(S);st.adj=st.adj||[];st.adj.push({player:ds.p,delta:+ds.d,at:Date.now(),seq:(st.endSeq||0)});
      commit(normalize(st));break;
    case 'away':
      st=clone(S);var p=st.players.find(function(x){return x.id===ds.p});p.away=!p.away;
      commit(normalize(st));break;
    case 'withdraw':
      st=clone(S);p=st.players.find(function(x){return x.id===ds.p});
      if(derive(st).P[p.id].busy){flash='Enter the result of their current match first.';render();return}
      p.withdrawn=true;commit(normalize(st));break;
    case 'tables':
      st=clone(S);var n=st.tables+(+ds.d);if(n<1||n>12)return;
      if(n<st.tables&&st.matches.some(function(x){return x.status==='live'&&x.table===st.tables})){flash='Table '+st.tables+' has a match in progress. Enter its result before removing the table.';render();return}
      st.tables=n;commit(normalize(st));break;
    case 'lead':st=clone(S);st.leadLimit=+el.value;commit(normalize(st));break;
    case 'viewOn':ui.settings=false;location.hash='view';break;
    case 'viewOff':history.replaceState(null,'',location.pathname+location.search);render();break;
    case 'claim':mode='shared';flash=null;render();break;
    case 'reset':
      st=blankState();st.title=S.title;st.tables=S.tables;st.leadLimit=S.leadLimit;
      draft={title:S.title,tables:S.tables,leadLimit:S.leadLimit,example:false,players:S.players.map(function(p){return {id:uid(),name:p.name,chips:p.chips}})};saveDraft();
      commit(st);break;
    case 'histAll':ui.histAll=!ui.histAll;render();break;
    /* setup */
    case 'dTables':draft.tables=Math.min(12,Math.max(1,draft.tables+(+ds.d)));saveDraft();render();break;
    case 'dChips':var dp=draft.players.find(function(x){return x.id===ds.p});dp.chips=Math.min(9,Math.max(1,dp.chips+(+ds.d)));saveDraft();render();break;
    case 'dRemove':draft.players=draft.players.filter(function(x){return x.id!==ds.p});saveDraft();render();break;
    case 'dAdd':
      var inp=document.getElementById('new-name'),cin=document.getElementById('new-chips');
      var nm=(inp.value||'').trim();if(!nm){inp.focus();return}
      draft.players.push({id:uid(),name:nm,chips:Math.min(9,Math.max(1,parseInt(cin.value,10)||3))});saveDraft();render();
      var ni=document.getElementById('new-name');if(ni)ni.focus();break;
    case 'dClear':draft.players=[];draft.example=false;saveDraft();render();break;
    case 'dPaste':
      var ta=document.getElementById('paste-box'),added=0;
      (ta.value||'').split(/\n+/).forEach(function(line){
        var mm=line.trim().match(/^(.*?)[\s,;\t]+(\d+)\s*$/),name,ch=3;
        if(mm){name=mm[1].trim();ch=parseInt(mm[2],10)}else name=line.trim();
        if(name){draft.players.push({id:uid(),name:name,chips:Math.min(9,Math.max(1,ch))});added++}
      });
      if(added){draft.example=false;ui.paste=false}saveDraft();render();break;
    case 'dPasteToggle':ui.paste=!ui.paste;render();break;
    case 'start':
      var err=setupError();if(err){flash=err;render();return}
      st=blankState();st.title=(draft.title||'Pool Chip Tournament').trim();st.tables=draft.tables;st.leadLimit=draft.leadLimit;
      st.players=draft.players.map(function(x){return {id:x.id,name:x.name.trim(),chips:x.chips}});
      st.phase='running';st.startedAt=Date.now();
      commit(normalize(st));break;
  }
}
function setupError(){
  var names=draft.players.map(function(p){return p.name.trim().toLowerCase()});
  if(draft.players.length<2)return 'Add at least 2 players.';
  if(names.some(function(n){return !n}))return 'Every player needs a name.';
  var dup=names.find(function(n,i){return names.indexOf(n)!==i});
  if(dup)return 'Two players are both named "'+dup+'". Add an initial so they can be told apart.';
  return null;
}

/* ---------- rendering ---------- */
function chipsHTML(cur,start){
  var total=Math.max(cur,start);
  if(total>9)return '<span class="chipnum">'+cur+'</span>';
  var s='<span class="chips" aria-label="'+cur+' of '+start+' chips">';
  for(var i=0;i<total;i++)s+='<span class="chip'+(i<cur?'':' gone')+'"></span>';
  return s+'</span>';
}
function mins(t){var m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?'just started':m+' min'}
function modeText(){
  if(saving)return 'Saving…';
  if(mode==='connecting')return 'Connecting…';
  if(mode==='local')return 'Saved on this device only.';
  if(mode==='readonly')return 'Live view. Results appear as the director enters them.';
  if(location.hash==='#view')return 'Previewing what players see.';
  return 'Live. Players you share this page with see updates as you enter them.';
}
function themeSeg(){return '<div class="seg" role="group" aria-label="Theme">'+[['auto','Auto'],['light','Light'],['dark','Dark']].map(function(o){return '<button data-act="theme" data-v="'+o[0]+'" class="'+(theme===o[0]?'on':'')+'" aria-pressed="'+(theme===o[0])+'">'+o[1]+'</button>'}).join('')+'</div>'}
function header(sub){
  var right=location.hash==='#view'&&(mode==='shared'||mode==='local')?'<button class="btn small primary" data-act="viewOff">Back to controls</button>':
    '<button class="btn small" data-act="settings" aria-expanded="'+!!ui.settings+'">'+(ui.settings?'Done':'Settings')+'</button>';
  return '<header class="top"><div class="ttl"><h1>'+h(S.phase==='setup'&&canAct()?(draft.title||'Pool Chip Tournament'):S.title)+'</h1>'+(sub?'<p class="sub">'+sub+'</p>':'')+'</div>'+right+'</header>'+
    (flash?'<div class="flash" role="status">'+h(flash)+'</div>':'');
}
function settingsPanel(done){
  var can=canAct(),out='<section class="sheet"><div class="srow2"><span>Theme</span>'+themeSeg()+'</div>';
  if(can&&S.phase==='running'){
    out+='<div class="srow2"><span>Tables in use</span><span class="stepper"><button data-act="tables" data-d="-1" aria-label="Remove a table" '+(S.tables<=1?'disabled':'')+'>−</button><output>'+S.tables+'</output><button data-act="tables" data-d="1" aria-label="Add a table" '+(S.tables>=12?'disabled':'')+'>+</button></span></div>'+
      '<div class="srow2"><label for="lead-sel">Draw pace</label><select class="in sel" id="lead-sel"><option value="1"'+(S.leadLimit===1?' selected':'')+'>Strict rounds</option><option value="2"'+(S.leadLimit===2?' selected':'')+'>Balanced</option><option value="99"'+(S.leadLimit===99?' selected':'')+'>Fastest</option></select></div>';
  }
  if(can&&S.phase!=='setup')out+='<div class="srow2"><span>See the page as players do</span><button class="btn small" data-act="viewOn">Preview</button></div>';
  out+='<p class="note">'+h(modeText())+'</p>';
  if(mode==='readonly')out+='<button class="link" data-act="claim">I\'m the director</button>';
  if(can&&S.phase!=='setup'){
    out+=ui.confirm==='reset'?'<div class="confirm"><p>Start a new tournament? Every result is cleared. Your player list is kept so you can edit it.</p><button class="btn small danger" data-act="reset">Start over</button><button class="btn small" data-act="unpick">Keep</button></div>':
      '<button class="link danger" data-act="ask" data-v="reset">'+(done?'Start a new tournament':'End and start over')+'</button>';
  }
  return out+'</section>';
}

function renderSetup(){
  if(!canAct()){
    if(ui.settings)return header('Not started yet')+settingsPanel(false);
    return header('Not started yet')+'<div class="card"><h2>Not started yet</h2><p class="hint">The director is setting up the player list. This page updates by itself once the first matches are drawn.</p></div>';
  }
  if(ui.settings)return header('Set up players and tables')+settingsPanel(false);
  var err=setupError(),total=draft.players.reduce(function(a,p){return a+p.chips},0);
  var paces=[[1,'Strict rounds','Everyone plays once before anyone plays again. Fairest, but tables sit idle while the slowest match finishes.'],[2,'Balanced (recommended)','Tables refill as soon as they free up. A player can only start a new match if they are at most one ahead of whoever has played the fewest.'],[99,'Fastest','Tables always refill with whoever is free. Match counts can drift apart.']];
  var h1='<div class="card"><label class="f">Tournament name<input class="in" id="d-title" value="'+h(draft.title)+'" maxlength="60"></label>'+
    '<div class="rowflex"><div><b>Tables</b><div class="hint">How many tables run at once</div></div><div class="stepper"><button data-act="dTables" data-d="-1" aria-label="Fewer tables" '+(draft.tables<=1?'disabled':'')+'>−</button><output>'+draft.tables+'</output><button data-act="dTables" data-d="1" aria-label="More tables" '+(draft.tables>=12?'disabled':'')+'>+</button></div></div>'+
    '<div><b>Draw pace</b><div class="pace" style="margin-top:8px">'+paces.map(function(p){return '<label class="'+(draft.leadLimit===p[0]?'on':'')+'"><input type="radio" name="pace" id="pace-'+p[0]+'" value="'+p[0]+'" '+(draft.leadLimit===p[0]?'checked':'')+'><span><b>'+p[1]+'</b><small>'+p[2]+'</small></span></label>'}).join('')+'</div></div>'+
    '<div class="note">How it runs: each loss costs one chip, and a player at zero chips is out. Each free table gets the waiting player with the fewest matches played, then the longest wait, then a random pick. Back-to-back rematches are avoided until only two players remain. The last player with chips wins.</div></div>';
  var rows=draft.players.map(function(p,i){return '<div class="prow"><input class="in" data-name="'+p.id+'" id="n-'+p.id+'" value="'+h(p.name)+'" aria-label="Player '+(i+1)+' name" maxlength="40"><div class="stepper"><button data-act="dChips" data-p="'+p.id+'" data-d="-1" aria-label="Fewer chips" '+(p.chips<=1?'disabled':'')+'>−</button><output>'+p.chips+'</output><button data-act="dChips" data-p="'+p.id+'" data-d="1" aria-label="More chips" '+(p.chips>=9?'disabled':'')+'>+</button></div><button class="xbtn" data-act="dRemove" data-p="'+p.id+'" aria-label="Remove '+h(p.name)+'">×</button></div>'}).join('');
  var h2='<div class="card"><div class="sec-head"><h2>Players ('+draft.players.length+')</h2><span class="hint">'+total+' chips total</span></div>'+
    (draft.example?'<div class="note ex">These are example players. Replace them with your field, or tap Clear list.</div>':'')+
    '<div class="plist">'+(rows||'<div class="empty">No players yet. Add them below.</div>')+'</div>'+
    '<div class="prow"><input class="in" id="new-name" placeholder="Player name" maxlength="40"><input class="in" id="new-chips" type="number" min="1" max="9" value="3" style="flex:0 0 64px" aria-label="Starting chips"><button class="btn chalk" data-act="dAdd">Add</button></div>'+
    '<div class="rowflex"><button class="link" data-act="dPasteToggle">'+(ui.paste?'Hide paste box':'Paste a list')+'</button>'+(draft.players.length?'<button class="link danger" data-act="dClear">Clear list</button>':'')+'</div>'+
    (ui.paste?'<textarea class="in" id="paste-box" placeholder="One player per line, name then chips:\nMarcus 2\nTasha, 3"></textarea><button class="btn" data-act="dPaste">Add these players</button>':'')+
    '<button class="btn primary" data-act="start" '+(err?'disabled':'')+'>Start tournament and draw first matches</button>'+(err?'<div class="hint">'+h(err)+'</div>':'')+'</div>';
  return header('Set up players and tables')+'<div class="setup">'+h1+h2+'</div>';
}

function tableCards(d){
  var live={};S.matches.forEach(function(m){if(m.status==='live')live[m.table]=m});
  var blocked={};(S.blocked||[]).forEach(function(b){blocked[b.table]=b});
  var out='',can=canAct();
  for(var t=1;t<=S.tables;t++){
    var m=live[t];
    if(m){
      var A=d.P[m.a],B=d.P[m.b],pend=ui.pending&&ui.pending.m===m.id?ui.pending.w:null;
      var pb=function(p){var sel=pend===p.id,lose=pend&&!sel,delay=sel&&ui.pending.at?' style="animation-delay:-'+Math.min(3000,Date.now()-ui.pending.at)+'ms"':'';
        return '<button class="pbtn'+(sel?' sel':'')+(lose?' lose':'')+'"'+delay+' data-act="pick" data-m="'+m.id+'" data-w="'+p.id+'" '+(can?'':'disabled')+'><span class="pname">'+h(p.name)+(sel?'<span class="wtag">Winner</span>':'')+'</span>'+chipsHTML(p.cur,p.chips)+'</button>'};
      var top=A,bot=B;if(pend===m.b){top=B;bot=A}
      var cancel='';
      if(can&&!pend)cancel=ui.confirm==='cm'+m.id?'<span class="cm"><button class="link danger" data-act="cancelMatch" data-m="'+m.id+'">Cancel this match</button><button class="link" data-act="unpick">Keep</button></span>':'<button class="link quiet" data-act="ask" data-v="cm'+m.id+'" aria-label="Cancel match on table '+t+'">Cancel</button>';
      out+='<article class="tcard"><div class="thead"><h3>Table '+t+'</h3><span class="tm"><span class="elapsed" data-t="'+m.startedAt+'">'+mins(m.startedAt)+'</span>'+(cancel?' · ':'')+cancel+'</span></div>'+
        pb(top)+'<div class="vs">'+(pend?'beat':'vs')+'</div>'+pb(bot)+
        (pend?'<div class="confirm"><p>'+h(d.P[pend===m.a?m.b:m.a].name)+' loses a chip.</p><button class="btn primary" data-act="win" data-m="'+m.id+'" data-w="'+pend+'">Confirm</button><button class="btn" data-act="unpick">Undo</button></div>':'')+
        '</article>';
    }else{
      var b=blocked[t],msg='Waiting for a free player';
      if(b&&b.reason==='lead')msg='Held so everyone plays a fair number of matches';
      if(b&&b.reason==='rematch')msg=b.names[0]+' and '+b.names[1]+' just played each other';
      var canForce=can&&d.active.filter(function(p){return !p.busy}).length>=2;
      out+='<article class="tcard open"><div class="thead"><h3>Table '+t+'</h3><span class="tm">Open</span></div><p class="open-msg">'+h(msg)+'.</p>'+(canForce?'<button class="btn small" data-act="force" data-t="'+t+'">Start a match here</button>':'')+'</article>';
    }
  }
  return out;
}
function standings(d,done){
  var alive=d.alive.slice().sort(function(x,y){return y.cur-x.cur||x.played-y.played||x.name.localeCompare(y.name)});
  var gone=d.list.filter(function(p){return !p.alive}).sort(function(x,y){return y.lastEnd-x.lastEnd});
  var canE=canAct()&&!done;
  function row(p,i){
    var status=done&&p.alive?'Winner':p.withdrawn?'Withdrew':!p.alive?'':p.busy?'Table '+p.table:p.away?'Away':'';
    var edit='';
    if(canE&&ui.edit===p.id){
      edit='<div class="edit"><p class="hint">'+p.wins+' wins, '+p.losses+' losses'+(p.adjust?', '+(p.adjust>0?'+':'')+p.adjust+' chip adjustment':'')+'.</p><div class="btns">'+
        '<button class="btn small" data-act="adj" data-p="'+p.id+'" data-d="-1" '+(p.cur<=0?'disabled':'')+'>− Chip</button>'+
        '<button class="btn small" data-act="adj" data-p="'+p.id+'" data-d="1" '+(p.withdrawn?'disabled':'')+'>+ Chip</button>'+
        (p.alive?'<button class="btn small" data-act="away" data-p="'+p.id+'">'+(p.away?'Back':'Away')+'</button>':'')+
        (p.alive&&!p.busy?(ui.confirm==='wd'+p.id?'<button class="btn small danger" data-act="withdraw" data-p="'+p.id+'">Confirm withdraw</button>':'<button class="btn small" data-act="ask" data-v="wd'+p.id+'">Withdraw</button>'):'')+
        '</div></div>';
    }
    var inner='<span class="rank">'+(p.alive?i+1:'')+'</span><span class="sname">'+h(p.name)+'</span><span class="sstat">'+status+'</span>'+(p.alive?chipsHTML(p.cur,p.chips):'');
    return '<li class="srow'+(p.alive?'':' out')+(ui.edit===p.id?' open':'')+'">'+(canE?'<button class="rowbtn" data-act="editP" data-p="'+p.id+'" aria-expanded="'+(ui.edit===p.id)+'">'+inner+'</button>':'<div class="rowbtn">'+inner+'</div>')+edit+'</li>';
  }
  return '<ul class="list">'+alive.map(row).join('')+'</ul>'+
    (gone.length?'<h2 class="h-out">Out</h2><ul class="list">'+gone.map(function(p){return row(p,0)}).join('')+'</ul>':'');
}
function historyRows(d){
  var items=S.matches.filter(function(m){return m.status!=='live'}).map(function(m){return {k:m.endedSeq!=null?m.endedSeq+.5:(m.n/1000),m:m}});
  (S.adj||[]).forEach(function(a,i){items.push({k:(a.seq||0)+.7+i/1e4,a:a})});
  items.sort(function(x,y){return y.k-x.k});
  var shown=ui.histAll?items:items.slice(0,10),can=canAct()&&S.phase!=='setup';
  if(!items.length)return '<p class="empty">Finished matches show up here.</p>';
  return '<ul class="list">'+shown.map(function(it){
    if(it.a){var p=d.P[it.a.player];return '<li class="lrow"><div class="rowbtn"><span class="txt">'+h(p?p.name:'?')+(it.a.delta>0?' was given a chip':' had a chip removed')+'</span><span class="sstat">Adjusted</span></div></li>'}
    var m=it.m,A=d.P[m.a],B=d.P[m.b];
    if(m.status==='void')return '<li class="lrow void"><div class="rowbtn"><span class="txt">'+h(A.name)+' vs '+h(B.name)+'</span><span class="sstat">Cancelled</span></div></li>';
    var W=d.P[m.winner],L=m.winner===m.a?B:A,openRow=ui.edit===m.id,acts='';
    if(can&&openRow){
      if(ui.confirm==='fl'+m.id)acts='<div class="confirm"><p>Make '+h(L.name)+' the winner? '+h(W.name)+' loses a chip instead.</p><button class="btn small primary" data-act="flip" data-m="'+m.id+'">Swap</button><button class="btn small" data-act="unpick">Keep</button></div>';
      else if(ui.confirm==='vr'+m.id)acts='<div class="confirm"><p>Remove this result? '+h(L.name)+' gets the chip back.</p><button class="btn small danger" data-act="voidRes" data-m="'+m.id+'">Remove</button><button class="btn small" data-act="unpick">Keep</button></div>';
      else acts='<div class="edit"><div class="btns"><button class="btn small" data-act="ask" data-v="fl'+m.id+'">Swap winner</button><button class="btn small" data-act="ask" data-v="vr'+m.id+'">Remove result</button></div></div>';
    }
    var inner='<span class="txt"><b>'+h(W.name)+'</b> beat '+h(L.name)+(m.note?' <span class="hint">('+h(m.note.toLowerCase())+')</span>':'')+'</span><span class="sstat">Table '+m.table+'</span>';
    return '<li class="lrow'+(openRow?' open':'')+'">'+(can?'<button class="rowbtn" data-act="editM" data-m="'+m.id+'" aria-expanded="'+openRow+'">'+inner+'</button>':'<div class="rowbtn">'+inner+'</div>')+acts+'</li>';
  }).join('')+'</ul>'+(items.length>10?'<button class="link more" data-act="histAll">'+(ui.histAll?'Show fewer':'Show all '+items.length)+'</button>':'');
}

function renderRunning(){
  var d=derive(S),done=S.phase==='done';
  var liveN=S.matches.filter(function(m){return m.status==='live'}).length;
  var sub=done?'Finished':d.alive.length+' of '+d.list.length+' players left · '+liveN+' playing';
  if(ui.settings)return header(sub)+settingsPanel(done);
  var win='';
  if(done){var w=d.alive[0];win='<div class="winner"><h2>'+h(w?w.name+' wins':'No winner')+'</h2><p>'+(w?w.wins+' wins from '+w.played+' matches, '+w.cur+' chip'+(w.cur===1?'':'s')+' left.':'')+'</p></div>'}
  var tabsDef=done?[['standings','Standings'],['history','History']]:[['tables','Tables'],['standings','Standings'],['history','History']];
  var tab=ui.tab;if(done&&tab==='tables')tab='standings';
  var tabs='<nav class="tabs" role="tablist">'+tabsDef.map(function(t){return '<button role="tab" class="'+(tab===t[0]?'on':'')+'" aria-selected="'+(tab===t[0])+'" data-act="tab" data-v="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</nav>';
  var body='';
  if(tab==='tables'){
    var res='',age=ui.last?Date.now()-ui.last.at:1e9;
    if(age<3000){var L=ui.last;res='<div class="result" role="status" style="animation-delay:-'+age+'ms"><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="var(--win)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span><b>'+h(L.w)+'</b> beat '+h(L.l)+'. '+h(L.l)+(L.left>0?' has '+L.left+' chip'+(L.left===1?'':'s')+' left.':' is out.')+'</span></div>'}
    var waiting=d.active.filter(function(p){return !p.busy}).map(function(p){return h(p.name)});
    var away=d.alive.filter(function(p){return p.away}).map(function(p){return h(p.name)});
    body=res+(canAct()?'<p class="hint lead">Tap the player who won.</p>':'')+'<div class="tables">'+tableCards(d)+'</div>'+
      (waiting.length?'<p class="waiting"><span>Up next</span>'+waiting.join(', ')+'</p>':'')+
      (away.length?'<p class="waiting"><span>Away</span>'+away.join(', ')+'</p>':'');
  }else if(tab==='standings'){
    body=(canAct()&&!done?'<p class="hint lead">Tap a player to fix chips or mark them away.</p>':'')+standings(d,done);
  }else{
    body=(canAct()?'<p class="hint lead">Tap a result to correct it.</p>':'')+historyRows(d);
  }
  return header(sub)+win+tabs+'<section class="body">'+body+'</section>';
}

var lastTimer=null;
function render(){
  var html=S.phase==='setup'?renderSetup():renderRunning();
  root.innerHTML='<div class="wrap">'+html+'</div>'+(saving?'<div class="saving-veil" aria-hidden="true"></div>':'');
  if(ui.last&&!lastTimer){var left=3000-(Date.now()-ui.last.at);
    if(left>0)lastTimer=setTimeout(function(){lastTimer=null;var r=root.querySelector('.result');if(r)r.remove();ui.last=null},left+50);else ui.last=null}
}

/* ---------- events ---------- */
root.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  if(saving)return;
  act(el.dataset.act,el);
});
root.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='d-title'){draft.title=t.value;saveDraft();var h1=root.querySelector('h1');if(h1)h1.textContent=t.value||'Pool Chip Tournament'}
  else if(t.dataset&&t.dataset.name){var p=draft.players.find(function(x){return x.id===t.dataset.name});if(p){p.name=t.value;draft.example=false;saveDraft()}}
});
root.addEventListener('change',function(e){
  var t=e.target;
  if(t.name==='pace'){draft.leadLimit=+t.value;saveDraft();render()}
  else if(t.id==='lead-sel'){if(!saving)act('lead',t)}
  else if(t.dataset&&t.dataset.name){render()}
});
root.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&(e.target.id==='new-name'||e.target.id==='new-chips')){e.preventDefault();act('dAdd',e.target)}
});
window.addEventListener('hashchange',render);
setInterval(function(){root.querySelectorAll('.elapsed').forEach(function(el){el.textContent=mins(+el.dataset.t)})},30000);

/* ---------- boot ---------- */
function goLocal(){
  mode='local';
  var ls=lsGet(LS_STATE);
  if(ls&&ls.v&&(ls.updatedAt||0)>(S.updatedAt||0))S=ls;
  render();
}
render();
(function(){
  var c=window.claude;
  if(!c||typeof c.use!=='function'){goLocal();return}
  Promise.resolve(c.use('artifact')).catch(function(){return null}).then(function(a){
    art=a;
    if(!art){goLocal();return}
    return Promise.resolve(c.use('user')).catch(function(){return null}).then(function(u){
      if(!u){mode='readonly';render();return}
      return Promise.resolve(u.canEdit()).catch(function(){return null}).then(function(can){mode=can===false?'readonly':'shared';render()});
    });
  });
})();
})();
</script>

</body></html>
