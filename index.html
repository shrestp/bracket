<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Pool Chip Tournament</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style id="css">
/* Layout: an iOS-style grouped list app. Large title, segmented control, inset grouped sections,
   action sheets for anything destructive, a settings sheet, and a brief top banner after each result.
   Colors are Apple's system grays and labels, with system orange as the single tint. */
:root{
  --bg:#f2f2f7; --cell:#ffffff; --cell-2:#f2f2f7; --fill:rgba(118,118,128,.12); --fill-2:rgba(120,120,128,.2);
  --label:#000000; --label-2:rgba(60,60,67,.6); --label-3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.29);
  --tint:#ff8d28; --tint-text:#c55300; --tint-ink:#ffffff; --tint-soft:rgba(255,141,40,.14);
  --green:#34c759; --green-ink:#ffffff; --green-soft:rgba(52,199,89,.16); --green-text:#008932;
  --red:#ff383c; --red-text:#e9152d;
  --chip:#ff8d28; --chip-empty:rgba(120,120,128,.24);
  --thumb:#ffffff; --material:rgba(255,255,255,.78); --scrim:rgba(0,0,0,.32);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --fd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif;
  --r:12px; --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --cell:#1c1c1e; --cell-2:#2c2c2e; --fill:rgba(118,118,128,.24); --fill-2:rgba(120,120,128,.36);
  --label:#ffffff; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --tint:#ff9230; --tint-text:#ff9230; --tint-ink:#ffffff; --tint-soft:rgba(255,146,48,.18);
  --green:#30d158; --green-ink:#00240d; --green-soft:rgba(48,209,88,.2); --green-text:#30d158;
  --red:#ff4245; --red-text:#ff4245;
  --chip:#ff9230; --chip-empty:rgba(120,120,128,.36);
  --thumb:#636366; --material:rgba(30,30,32,.78); --scrim:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1c1c1e; --cell-2:#2c2c2e; --fill:rgba(118,118,128,.24); --fill-2:rgba(120,120,128,.36);
  --label:#ffffff; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --tint:#ff9230; --tint-text:#ff9230; --tint-ink:#ffffff; --tint-soft:rgba(255,146,48,.18);
  --green:#30d158; --green-ink:#00240d; --green-soft:rgba(48,209,88,.2); --green-text:#30d158;
  --red:#ff4245; --red-text:#ff4245;
  --chip:#ff9230; --chip-empty:rgba(120,120,128,.36);
  --thumb:#636366; --material:rgba(30,30,32,.78); --scrim:rgba(0,0,0,.5); color-scheme:dark}

body{background:var(--bg);color:var(--label);font-family:var(--f);font-size:17px;line-height:1.3;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--tint) 60%,transparent);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 72px;padding-inline:16px;display:flex;flex-direction:column;gap:22px}

/* navigation bar */
.nav{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:12px}
.nav .ttl{min-width:0}
h1{margin:0;font-family:var(--fd);font-weight:700;font-size:34px;line-height:1.2;letter-spacing:.01em;text-wrap:balance}

.iconbtn:active{opacity:.5}
.iconbtn svg{width:20px;height:20px}
.navtext{border:0;background:none;color:var(--tint-text);font-size:17px;font-weight:600;padding:8px 0;margin-bottom:4px}

/* segmented control */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:0;position:relative}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:6px 10px;min-height:32px;font-size:14px;font-weight:500;color:var(--label);position:relative;transition:background-color .25s var(--ease)}

.group{display:flex;flex-direction:column;gap:7px}

.list{display:flex;flex-direction:column;margin:0;padding:0;background:var(--cell);border-radius:var(--r);overflow:hidden}
.cell{position:relative;display:flex;align-items:center;gap:12px;min-height:48px;padding:11px 16px;width:100%;border:0;background:var(--cell);text-align:left;font-size:17px;color:var(--label)}
.list>.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.list>.cell.ind+.cell::before,.list>.cell+.cell.ind::before{left:50px}

.cell.dim .grow{color:var(--label-2)}

.pcell{min-height:60px;padding-block:14px}

.pcell.sel{animation:winflash 3s var(--ease) both}

.pcell.sel .check{animation:pop .45s var(--ease) both;background:var(--green-ink);color:var(--green)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.pcell.lose .name,.pcell.lose .chips{opacity:.4}
.wlabel{font-size:13px;font-weight:600;color:var(--green-text)}
.pcell.sel .wlabel{color:inherit}
.chips{display:inline-flex;gap:5px;align-items:center;flex:none}
.chip{width:12px;height:12px;border-radius:50%;background:var(--chip)}
.chip.gone{background:var(--chip-empty)}
.chipnum{font-weight:600;color:var(--tint-text);font-variant-numeric:tabular-nums}
.actions{display:flex;gap:10px;padding:2px 0 0}

/* buttons */
.btn{border:0;border-radius:12px;min-height:50px;padding:0 20px;font-size:17px;font-weight:600;background:var(--fill);color:var(--tint-text);transition:opacity .15s,transform .15s var(--ease)}
.btn:active:not(:disabled){opacity:.7;transform:scale(.98)}
.btn.primary{background:var(--tint);color:var(--tint-ink);flex:1}
.btn.wide{width:100%}
.btn.small{min-height:34px;padding:0 14px;font-size:15px;border-radius:999px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.tlink{border:0;background:none;padding:0;color:var(--tint-text);font-size:15px;text-transform:none}
.tlink:active{opacity:.5}
.undo{border:0;background:var(--tint-soft);color:var(--tint-text);border-radius:999px;height:28px;padding:0 11px 0 9px;margin-left:10px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:4px;vertical-align:middle;text-transform:none}
.undo svg{width:15px;height:15px}
.undo:active{opacity:.5}
.ghead .r{display:inline-flex;align-items:center}
.switch{flex:none;width:51px;height:31px;border-radius:999px;border:0;background:var(--fill-2);position:relative;padding:0;transition:background-color .25s var(--ease)}
.switch i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .3s var(--ease)}
.switch.on{background:var(--green)}
.switch.on i{transform:translateX(20px)}
.more{border:0;background:var(--fill);color:var(--label-2);border-radius:999px;min-width:34px;height:24px;margin-left:10px;font-size:11px;letter-spacing:1px;padding:0 8px;vertical-align:1px}
.more:active{opacity:.5}

/* stepper */
.stepper{display:inline-flex;align-items:center;background:var(--fill);border-radius:9px;flex:none;overflow:hidden}
.stepper button{border:0;background:none;width:46px;height:32px;font-size:22px;line-height:1;color:var(--label);display:grid;place-items:center}
.stepper button+button{position:relative}
.stepper button+button::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:1px;background:var(--sep)}
.stepper button:active:not(:disabled){background:var(--fill-2)}
.stepper button:disabled{color:var(--label-3);cursor:not-allowed}
.val{font-variant-numeric:tabular-nums;color:var(--label-2);min-width:18px;text-align:right}

/* inputs */
.tin{flex:1;min-width:0;border:0;background:none;padding:0;font-size:17px;color:var(--label);outline:0}
.tin::placeholder{color:var(--label-3)}
.num{width:44px;flex:none;text-align:center;border:0;border-radius:8px;background:var(--fill);padding:5px 0;font-size:17px;outline:0}
.minus,.plus{width:24px;height:24px;flex:none;border:0;border-radius:50%;display:grid;place-items:center;color:#fff;padding:0}
.minus{background:var(--red)} .plus{background:var(--green)}
.minus svg,.plus svg{width:12px;height:12px}
textarea.tin{min-height:110px;resize:vertical;line-height:1.4}

/* winner */
.hero{background:var(--cell);border-radius:var(--r);padding:28px 20px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.hero .medal{width:64px;height:64px;border-radius:50%;background:var(--tint);color:var(--tint-ink);display:grid;place-items:center;margin-bottom:8px}
.hero .medal svg{width:32px;height:32px}
.hero h2{margin:0;font-family:var(--fd);font-size:28px;font-weight:700}
.hero p{margin:0;color:var(--label-2);font-size:15px}

/* banner after a result */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:40;display:flex;align-items:center;gap:12px;width:min(420px,calc(100% - 32px));padding:12px 16px;border-radius:18px;background:var(--material);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 10px 30px rgba(0,0,0,.18);font-size:15px;line-height:1.3;transform:translateX(-50%);animation:toast 3s var(--ease) both}
.toast .check{width:28px;height:28px}
.toast b{font-weight:600}
.toast span{color:var(--label-2)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-24px) scale(.96)}12%{opacity:1;transform:translate(-50%,0) scale(1)}85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-16px)}}
.flash{background:var(--tint-soft);border-radius:var(--r);padding:12px 16px;font-size:15px}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;animation:fade .3s var(--ease) both}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:50%;bottom:0;z-index:31;width:min(680px,100%);max-height:88vh;overflow:auto;background:var(--bg);border-radius:14px 14px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px;transform:translateX(-50%);animation:up .45s var(--ease) both;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
@keyframes up{from{transform:translate(-50%,100%)}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label-3);margin:0 auto -8px}
.sbar{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.sbar h2{margin:0;font-size:17px;font-weight:600}
.asheet{position:fixed;left:50%;bottom:0;z-index:31;width:min(440px,100%);padding:0 8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;transform:translateX(-50%);animation:up .4s var(--ease) both}
.asheet .list{background:var(--material);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-radius:14px}
.asheet .cell{background:transparent;justify-content:center;font-size:20px;min-height:57px;color:var(--tint-text)}
.asheet .cell.danger{color:var(--red-text)}
.asheet .cell.bold{font-weight:600}
.asheet .cell:active{background:var(--fill)}
.asheet .title{padding:14px 16px;text-align:center;font-size:13px;color:var(--label-2);line-height:1.35}
.asheet .title b{display:block;font-size:13px;font-weight:600;color:var(--label-2);margin-bottom:2px}
.asheet .cancel{background:var(--cell);border-radius:14px}
.asheet .cancel .cell{font-weight:600;background:var(--cell)}
.veil{position:fixed;inset:0;z-index:50;cursor:progress}
.empty{background:var(--cell);border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--label-2);font-size:15px;margin:0}
.paste{padding:12px 16px}
.nochips .val,.nochips .stepper{display:none}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.meta{display:block;font-size:13px;color:var(--label-2);font-weight:400;letter-spacing:0}
.meta .tlink{font-size:13px}
.tiers{display:flex;gap:4px;flex-wrap:wrap}
.tchip{border:0;background:var(--fill);color:var(--label);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:500;min-height:26px}
.tchip.on{background:var(--tint);color:var(--tint-ink);font-weight:600}
.lvlin{border:0;background:var(--fill);border-radius:6px;padding:2px 6px;font-size:13px;color:var(--tint-text);font-weight:600;-webkit-appearance:none;appearance:none}
.val.man{color:var(--tint-text);font-weight:600}
.lvl{width:auto;padding:5px 8px;font-size:15px;appearance:none;-webkit-appearance:none;color:var(--label)}
.newtag{font-size:11px;font-weight:600;color:var(--tint-text);background:var(--tint-soft);border-radius:999px;padding:1px 7px;vertical-align:2px;margin-left:4px}
.rnum{font-weight:700;font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.cpill{min-width:28px;height:28px;border-radius:999px;background:var(--fill);color:var(--tint-text);font-weight:700;display:grid;place-items:center;font-size:15px;font-variant-numeric:tabular-nums}
.seg.big button{padding-inline:4px}
@media (min-width:700px){h1{font-size:40px}.wrap{padding-top:36px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.pcell.sel{background:var(--green-soft)}}
</style>

<script type="application/json" id="tstate">{"v":1,"title":"Pool Chip Tournament","tables":2,"leadLimit":2,"phase":"setup","players":[],"matches":[],"adj":[],"seq":0,"endSeq":0,"blocked":[],"updatedAt":0}</script>
<script id="app">
(function(){
"use strict";
var RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
var FONTS='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap';
var LS_STATE='pct.state.v1', LS_DRAFT='pct.draft.v1', SS_UI='pct.ui.v1';
var root=document.getElementById('root');

function lsGet(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function clone(o){return JSON.parse(JSON.stringify(o))}
function h(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rnd(){try{var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296}catch(e){return Math.random()}}
function uid(){return 'p'+Math.floor(rnd()*1e9).toString(36)+Date.now().toString(36).slice(-4)}

function blankState(){return {v:1,title:'Pool Chip Tournament',tables:2,leadLimit:2,phase:'setup',players:[],matches:[],adj:[],seq:0,endSeq:0,blocked:[],updatedAt:0}}
var S=null;
try{S=JSON.parse(document.getElementById('tstate').textContent)}catch(e){}
if(!S||!S.v)S=blankState();

var mode='connecting'; // connecting | shared | local | readonly
var art=null, saving=false, flash=null;
var ui={tab:'tables',pending:null,edit:null,confirm:null,histAll:false,last:null,sheet:null};
try{var su=JSON.parse(sessionStorage.getItem(SS_UI)||'null');if(su){ui.tab=su.tab||'tables';flash=su.flash||null;if(su.last){ui.last=su.last;ui.last.at=Date.now()}if(su.sheet)ui.sheet=su.sheet;sessionStorage.removeItem(SS_UI)}}catch(e){}

/* theme: auto follows the device; light/dark is remembered on this device */
var LS_THEME='pct.theme', hostTheme=document.documentElement.getAttribute('data-theme');
var theme=lsGet(LS_THEME)||'auto';
function applyTheme(){
  var r=document.documentElement;
  if(theme==='light'||theme==='dark')r.setAttribute('data-theme',theme);
  else if(hostTheme)r.setAttribute('data-theme',hostTheme);
  else r.removeAttribute('data-theme');
}
applyTheme();

var EXAMPLES=[['Marcus',2],['Tasha',3],['Dev',3],['Rosa',4],['Kenji',2],['Lena',4],['Omar',3],['Priya',4]];
var draft=lsGet(LS_DRAFT);
if(!draft||!draft.players){draft={title:'Friday Chip Tournament',tables:2,leadLimit:2,example:true,players:EXAMPLES.map(function(x){return {id:uid(),name:x[0],chips:x[1]}})}}
function saveDraft(){lsSet(LS_DRAFT,draft)}

function viewMode(){return location.hash==='#view'||mode==='readonly'||mode==='connecting'}
function canAct(){return (mode==='shared'||mode==='local')&&location.hash!=='#view'&&!saving}

/* ---------- derived state ---------- */
function derive(st){
  var P={},list=[];
  st.players.forEach(function(p,i){var o=Object.assign({},p,{losses:0,wins:0,played:0,adjust:0,lastOpp:null,lastEnd:-1,vs:{},busy:null,table:null,seed:(st.seed&&st.seed[p.id]!=null)?st.seed[p.id]:i});P[p.id]=o;list.push(o)});
  st.matches.forEach(function(m){if(m.status==='live'){if(P[m.a]){P[m.a].busy=m.id;P[m.a].table=m.table}if(P[m.b]){P[m.b].busy=m.id;P[m.b].table=m.table}}});
  st.matches.filter(function(m){return m.status==='done'}).sort(function(x,y){return x.endedSeq-y.endedSeq}).forEach(function(m){
    var w=m.winner,l=w===m.a?m.b:m.a;
    if(!P[w]||!P[l])return;
    P[w].wins++;P[l].losses++;
    [[m.a,m.b],[m.b,m.a]].forEach(function(pr){var x=P[pr[0]];x.played++;x.lastOpp=pr[1];x.lastEnd=m.endedSeq;x.vs[pr[1]]=(x.vs[pr[1]]||0)+1});
  });
  (st.adj||[]).forEach(function(a){if(P[a.player])P[a.player].adjust+=a.delta});
  list.forEach(function(p){p.cur=Math.max(0,p.chips-p.losses+p.adjust);p.alive=p.cur>0&&!p.withdrawn;p.held=0});
  var hold=st.hold||{};Object.keys(hold).forEach(function(t){var q=P[hold[t]];if(q&&!q.busy)q.held=+t});
  var alive=list.filter(function(p){return p.alive});
  var active=alive.filter(function(p){return !p.away});
  var minPlayed=active.length?Math.min.apply(null,active.map(function(p){return p.played})):0;
  return {S:st,P:P,list:list,alive:alive,active:active,minPlayed:minPlayed};
}


/* ---------- ratings ----------
   Fargo-style scale: 100 points = 2-to-1 odds of winning a rack.
   Ratings are recomputed from every rack ever recorded (whole-history fit), so every device
   that has the same results shows the same numbers. A new player starts at their level and the
   start counts for about 3 racks; after that their results decide. */
var LS_DB='pct.db.v1', LS_GH='pct.gh.v1';
var TIERS={b:{label:'Beginner',start:400},a:{label:'Average',start:500},s:{label:'Strong',start:600}};
var BANDS=[[575,4],[500,5],[425,6],[-1e9,7]];
var PROV=5;
function nkey(n){return String(n||'').trim().toLowerCase().replace(/\s+/g,' ')}
function chipsFor(r){for(var i=0;i<BANDS.length;i++)if(r>=BANDS[i][0])return BANDS[i][1];return 7}
function levelFor(r){var c=chipsFor(r);return c<=4?'Strong':c>=7?'Beginner':'Average'}
function tierFromChips(c){return c<=4?'s':c>=7?'b':'a'}
var DB=(function(){var x=lsGet(LS_DB);return x&&x.players?x:{v:1,players:{},tournaments:{}}})();
var gh=lsGet(LS_GH)||{repo:'shrestp/bracket',token:''};
var sync={state:'idle',msg:'',sha:null,timer:null,at:0};
var RC=null,RCkey='';
function dbGames(db){
  var g=[],ts=Object.keys(db.tournaments).sort(function(a,b){return (db.tournaments[a].date||0)-(db.tournaments[b].date||0)});
  ts.forEach(function(t){(db.tournaments[t].matches||[]).forEach(function(m){var i;for(i=0;i<(m.rw||1);i++)g.push([m.w,m.l]);for(i=0;i<(m.rl||0);i++)g.push([m.l,m.w])})});
  return g;
}
function ratings(){
  var key=JSON.stringify(DB);if(RC&&key===RCkey)return RC;
  var keys=Object.keys(DB.players),R={},st={},by={},out={};
  keys.forEach(function(k){st[k]=(TIERS[DB.players[k].tier]||TIERS.a).start;R[k]=st[k];by[k]=[];out[k]={w:0,l:0}});
  dbGames(DB).forEach(function(x){if(!by[x[0]]||!by[x[1]])return;by[x[0]].push([x[1],1]);by[x[1]].push([x[0],0]);out[x[0]].w++;out[x[1]].l++});
  var c=Math.LN2/100,prior=1/(150*150);
  for(var it=0;it<80;it++){keys.forEach(function(k){
    var g=-(R[k]-st[k])*prior,H=-prior;
    by[k].forEach(function(o){var q=1/(1+Math.pow(2,-(R[k]-R[o[0]])/100));g+=c*(o[1]-q);H-=c*c*q*(1-q)});
    R[k]-=g/H;
  })}
  keys.forEach(function(k){var r=Math.round(R[k]),n=out[k].w+out[k].l;out[k]={key:k,name:DB.players[k].name,tier:DB.players[k].tier,rating:r,games:n,w:out[k].w,l:out[k].l,prov:n<PROV,chips:chipsFor(r),level:levelFor(r)}});
  RC=out;RCkey=key;return out;
}
function known(name){var k=nkey(name);return k&&DB.players[k]?ratings()[k]:null}
function recordTournament(st){
  if(!st||st.phase==='setup'||!st.players.length)return;
  if(!st.tid)st.tid='t'+(st.startedAt||Date.now());
  var P={};st.players.forEach(function(x){
    var k=x.key||nkey(x.name);P[x.id]=k;
    if(!DB.players[k])DB.players[k]={name:x.name.trim(),tier:x.tier||tierFromChips(x.chips),added:Date.now()};
  });
  DB.tournaments[st.tid]={date:st.startedAt||Date.now(),title:st.title,updatedAt:Date.now(),
    matches:(st.type==='de'?deCompute(st).list.filter(function(m){return m.state==='done'}).map(function(m){return {winner:m.w,a:m.p1,b:m.p2,rw:st.race||1,rl:m.rl||0}}):st.matches.filter(function(m){return m.status==='done'})).map(function(m){var l=m.winner===m.a?m.b:m.a;return {w:P[m.winner],l:P[l],rw:m.rw||1,rl:m.rl||0}})};
  saveDB(true);
}
function saveDB(push){lsSet(LS_DB,DB);RC=null;if(push&&canSync())schedulePush()}
function canSync(){return mode==='local'&&!!gh.token&&!!gh.repo}
function ghURL(){return 'https://api.github.com/repos/'+gh.repo+'/contents/ratings.json'}
function b64e(x){return btoa(unescape(encodeURIComponent(x)))}
function b64d(x){return decodeURIComponent(escape(atob(String(x).replace(/\s/g,''))))}
function ghHeaders(){var hd={'Accept':'application/vnd.github+json'};if(gh.token)hd.Authorization='Bearer '+gh.token;return hd}
function mergeDB(remote){
  if(!remote||!remote.players)return;
  Object.keys(remote.players).forEach(function(k){var a=DB.players[k],b=remote.players[k];if(!a||(b.tierAt||0)>(a.tierAt||0))DB.players[k]=b});
  Object.keys(remote.tournaments||{}).forEach(function(t){var a=DB.tournaments[t],b=remote.tournaments[t];if(!a||(b.updatedAt||0)>(a.updatedAt||0))DB.tournaments[t]=b});
  saveDB(false);
}
function ghPull(){
  if(!gh.repo||typeof fetch!=='function')return Promise.resolve();
  return fetch(ghURL()+'?ref=main&t='+Date.now(),{headers:ghHeaders(),cache:'no-store'}).then(function(r){
    if(r.status===404){sync.sha=null;return null}
    if(!r.ok)throw new Error(r.status===401?'The access token was refused. Paste a new one in Settings.':'GitHub answered '+r.status+'.');
    return r.json();
  }).then(function(j){if(j){sync.sha=j.sha;mergeDB(JSON.parse(b64d(j.content)))}});
}
function schedulePush(){clearTimeout(sync.timer);sync.state='pending';sync.timer=setTimeout(ghPush,8000)}
function ghPush(retry){
  if(!canSync())return;
  sync.state='saving';paintSync();
  ghPull().then(function(){
    var body={message:'Update ratings',content:b64e(JSON.stringify(DB)),branch:'main'};if(sync.sha)body.sha=sync.sha;
    return fetch(ghURL(),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHeaders()),body:JSON.stringify(body)});
  }).then(function(r){
    if((r.status===409||r.status===422)&&!retry)return ghPush(true);
    if(!r.ok)throw new Error(r.status===401||r.status===403?'GitHub refused the save. Check that the token can write to '+gh.repo+'.':'GitHub answered '+r.status+'.');
    return r.json().then(function(j){sync.sha=j.content&&j.content.sha;sync.state='saved';sync.at=Date.now();sync.msg='';paintSync()});
  }).catch(function(e){sync.state='error';sync.msg=e&&e.message||'Could not reach GitHub.';paintSync()});
}
function syncText(){
  if(mode==='shared'||mode==='readonly')return 'Ratings are saved with this page.';
  if(!gh.token)return 'Ratings are saved on this phone only. Connect GitHub in Settings to keep them in the repo.';
  if(sync.state==='saving'||sync.state==='pending')return 'Saving ratings to GitHub…';
  if(sync.state==='error')return sync.msg;
  if(sync.state==='saved')return 'Ratings saved to GitHub '+mins(sync.at).replace('just started','just now')+(sync.at&&Date.now()-sync.at>=60000?' ago':'')+'.';
  return 'Ratings sync with GitHub ('+h(gh.repo)+').';
}
function paintSync(){var el=document.getElementById('sync-line');if(el)el.textContent=syncText()}

/* ---------- the draw ---------- */
function stays(st){return st.stay!==false}
/* The queue: fewest matches played first, then whoever has waited longest, then a fixed draw order set at the start. */
function qcmp(x,y){return x.played-y.played||x.lastEnd-y.lastEnd||x.seed-y.seed}
function queue(d){return d.active.filter(function(p){return !p.busy&&!p.held}).sort(qcmp)}
function pickChallenger(d,H,force){
  var idle=d.active.filter(function(p){return !p.busy&&p.id!==H.id});
  var free=idle.filter(function(p){return !p.held});
  var pool=free.length?free:idle;
  if(!pool.length)return null;
  var opts=pool.filter(function(p){return p.id!==H.lastOpp});
  if(!opts.length){if(force||d.active.length<=2)opts=pool;else return null}
  opts.sort(qcmp);
  return opts[0];
}
function pickPair(d,force){
  var idle=d.active.filter(function(p){return !p.busy&&!p.held});
  if(idle.length<2)return {reason:'few'};
  var pool=idle;
  if(!force&&d.S.leadLimit<99){
    pool=idle.filter(function(p){return p.played-d.minPlayed<d.S.leadLimit});
    if(pool.length<2)return {reason:'lead'};
  }
  var order=pool.slice().sort(qcmp);
  for(var i=0;i<order.length;i++){
    var first=order[i];
    var opps=pool.filter(function(p){return p.id!==first.id&&p.id!==first.lastOpp});
    if(!opps.length)continue;
    opps.sort(qcmp);
    return {pair:[first.id,opps[0].id]};
  }
  if(force||d.active.length<=2)return {pair:[order[0].id,order[1].id]};
  return {reason:'rematch',names:[order[0].name,order[1].name]};
}
function fill(st,forceTable){
  st.blocked=[];st.hold=st.hold||{};
  if(!stays(st))st.hold={};
  Object.keys(st.hold).forEach(function(t){if(+t>st.tables)delete st.hold[t]});
  for(var t0=1;t0<=st.tables;t0++){
    var hid=st.hold[t0];if(!hid)continue;
    if(st.matches.some(function(m){return m.status==='live'&&m.table===t0})){delete st.hold[t0];continue}
    var d0=derive(st),H=d0.P[hid];
    if(!H||!H.alive||H.away||H.busy){delete st.hold[t0];continue}
    var c=pickChallenger(d0,H,forceTable===t0);
    if(!c){st.blocked.push({table:t0,reason:'challenger',names:[H.name]});continue}
    if(c.held)delete st.hold[c.held];
    delete st.hold[t0];
    st.seq++;
    st.matches.push({id:'m'+st.seq,n:st.seq,a:hid,b:c.id,table:t0,status:'live',winner:null,startedAt:Date.now(),endedSeq:null,endedAt:null});
  }
  for(var t=1;t<=st.tables;t++){
    if(st.matches.some(function(m){return m.status==='live'&&m.table===t}))continue;
    if(st.hold[t])continue;
    var r=pickPair(derive(st),forceTable===t);
    if(!r.pair){st.blocked.push({table:t,reason:r.reason,names:r.names||null});continue}
    st.seq++;
    st.matches.push({id:'m'+st.seq,n:st.seq,a:r.pair[0],b:r.pair[1],table:t,status:'live',winner:null,startedAt:Date.now(),endedSeq:null,endedAt:null});
  }
}
function normalize(st,forceTable){
  if(st.phase==='setup')return st;
  var d=derive(st);
  st.matches.forEach(function(m){if(m.status==='live'&&(!d.P[m.a].alive||!d.P[m.b].alive)){m.status='void';m.note='Cancelled: a player is out after a correction'}});
  d=derive(st);
  if(d.alive.length<=1){
    st.matches.forEach(function(m){if(m.status==='live'){m.status='void';m.note='Cancelled: tournament finished'}});
    st.phase='done';st.blocked=[];return st;
  }
  st.phase='running';
  fill(st,forceTable);
  return st;
}


/* ---------- double elimination ----------
   The bracket is fixed at the start (random draw, byes spread so no bye meets a bye).
   Every match's two places are fed by a seed, or by the winner or loser of an earlier match.
   Results are the only thing stored, so the whole bracket is recomputed from them, and an
   undo is just deleting a result. */
function seedOrder(P){var a=[1,2];while(a.length<P){var n=[],L=a.length*2;a.forEach(function(s){n.push(s,L+1-s)});a=n}return a}
function deBuild(n){
  var P=2,k=1;while(P<n){P*=2;k++}
  var M=[],id=function(b,r,i){return b+r+'-'+i},o=seedOrder(P),r,i,t;
  for(i=0;i<P/2;i++)M.push({id:id('W',1,i),b:'W',r:1,i:i,s1:{seed:o[2*i]},s2:{seed:o[2*i+1]}});
  for(r=2;r<=k;r++)for(i=0;i<P/Math.pow(2,r);i++)M.push({id:id('W',r,i),b:'W',r:r,i:i,s1:{win:id('W',r-1,2*i)},s2:{win:id('W',r-1,2*i+1)}});
  var lb;
  if(k>=2){
    for(i=0;i<P/4;i++)M.push({id:id('L',1,i),b:'L',r:1,i:i,s1:{lose:id('W',1,2*i)},s2:{lose:id('W',1,2*i+1)}});
    for(t=1;t<=k-1;t++){
      var cnt=P/Math.pow(2,t+1);
      for(i=0;i<cnt;i++)M.push({id:id('L',2*t,i),b:'L',r:2*t,i:i,s1:{win:id('L',2*t-1,i)},s2:{lose:id('W',t+1,t%2?cnt-1-i:i)}});
      if(t<=k-2)for(i=0;i<cnt/2;i++)M.push({id:id('L',2*t+1,i),b:'L',r:2*t+1,i:i,s1:{win:id('L',2*t,2*i)},s2:{win:id('L',2*t,2*i+1)}});
    }
    lb={win:id('L',2*(k-1),0)};
  }else lb={lose:id('W',1,0)};
  M.push({id:'G1-0',b:'G',r:1,i:0,s1:{win:id('W',k,0)},s2:lb});
  M.push({id:'G2-0',b:'G',r:2,i:0,s1:{win:'G1-0'},s2:{lose:'G1-0'},ifNeeded:true});
  return {P:P,k:k,matches:M};
}
function deStage(m,k){return m.b==='W'?2*m.r-2:m.b==='L'?m.r:100+m.r}
function deLabel(m,k){
  if(m.b==='G')return m.r===1?'Grand final':'Grand final, deciding match';
  if(m.b==='W')return m.r===k?'Winners final':'Winners round '+m.r;
  return m.r===2*(k-1)?'Losers final':'Losers round '+m.r;
}
function deCompute(st){
  var de=st.de,res=de.results||{},by={},list=[];

    var m=by[src.win||src.lose];if(!m||!m.done)return undefined;
    return src.win?m.w:m.l;
  }
  de.matches.forEach(function(d){
    var o={id:d.id,b:d.b,r:d.r,i:d.i,stage:deStage(d,de.k),label:deLabel(d,de.k),p1:val(d.s1),p2:val(d.s2),done:false,state:'wait'};
    by[d.id]=o;list.push(o);

      if(!g.done){o.p1=o.p2=undefined}
      else if(g.w===g.p1){o.done=true;o.skip=true;o.w=null;o.l=null;o.state='skip';return}
    }
    if(o.p1===undefined||o.p2===undefined)return;
    if(o.p1===null||o.p2===null){o.done=true;o.bye=true;o.w=o.p1||o.p2||null;o.l=null;o.state='bye';return}
    var r=res[d.id];
    if(r){o.done=true;o.state='done';o.w=r.w;o.l=r.w===o.p1?o.p2:o.p1;o.rl=r.rl||0;o.seq=r.seq;o.table=r.table;return}
    o.state='ready';
  });

  if(g1.done&&!g1.bye&&g1.w===g1.p1)champ=g1.w;else if(g2.done&&!g2.skip)champ=g2.w;else if(g1.bye)champ=g1.w;

function deDeps(st,mid){return st.de.matches.filter(function(d){return (d.s1.win===mid||d.s1.lose===mid||d.s2.win===mid||d.s2.lose===mid)})}
function deUndoable(st,mid){
  var r=st.de.results[mid];if(!r)return false;

}
function deNormalize(st){

  if(D.champ){st.phase='done';de.tables={};return st}
  st.phase='running';
  var used={};Object.keys(de.tables).forEach(function(mid){used[de.tables[mid].t]=1});
  var ready=D.list.filter(function(m){return m.state==='ready'&&!de.tables[m.id]}).sort(function(a,b){return a.stage-b.stage||a.i-b.i});
  for(var t=1;t<=st.tables&&ready.length;t++){if(used[t])continue;var m=ready.shift();de.tables[m.id]={t:t,at:Date.now()};used[t]=1}

function deStart(st,ids){
  var sh=ids.slice();for(var i=sh.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1)),x=sh[i];sh[i]=sh[j];sh[j]=x}

function deRecord(st){

function norm(st,f){return st.type==='de'?deNormalize(st):normalize(st,f)}

/* ---------- saving ---------- */
function renderDoc(st){
  var css=document.getElementById('css').textContent;
  var app=document.getElementById('app').textContent;
  var json=JSON.stringify(st).replace(/</g,'\\u003c');
  var SC='<'+'/script>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    '<title>Pool Chip Tournament</title>\n<link rel="stylesheet" href="'+FONTS+'">\n'+
    '<style id="css">'+css+'</style>\n<div id="root"></div>\n'+
    '<script type="application/json" id="tstate">'+json+SC+'\n'+
    '<script id="app">'+app+SC+'</body></html>';
}
function stashUI(msg){try{sessionStorage.setItem(SS_UI,JSON.stringify({tab:ui.tab,flash:msg||null,last:msg?null:ui.last,sheet:ui.sheet&&ui.sheet.t==='settings'?ui.sheet:null}))}catch(e){}}
function commit(next,attempt){
  if(saving&&!attempt)return;
  next.updatedAt=Date.now();
  recordTournament(next);
  if(mode==='shared')next.db=DB;
  ui.pending=null;ui.confirm=null;if(ui.sheet&&ui.sheet.t!=='settings')ui.sheet=null;
  if(mode==='local'){S=next;lsSet(LS_STATE,S);flash=null;render();return}
  if(mode!=='shared')return;
  saving=true;render();
  stashUI(null);
  art.publish(renderDoc(next)).then(function(){S=next;saving=false;flash=null;render()},function(e){
    var c=e&&e.code;saving=false;
    if(c==='conflict'){flash='Another device saved first. Loading the latest version, so check the tables before entering this again.';stashUI(flash)}
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='capability_removed'||c==='not_declared'){mode='readonly';flash='This is a read-only view. Only the tournament director can enter results.'}
    else if(c==='rate_limited'){flash='Saving too quickly. Wait a few seconds, then try again.'}
    else if(!attempt&&(c==='upstream_error'||!c)){saving=true;render();setTimeout(function(){commit(next,1)},600+rnd()*900);return}
    else{flash='Could not save ('+(c||'unknown error')+'). Try again.'}
    render();
  });
}

/* ---------- actions ---------- */
function act(name,el){
  var ds=el.dataset, st;
  switch(name){
    case 'tab':ui.tab=ds.v;render();break;
    case 'pick':if(!canAct())return;act('win',el);break;
    case 'undo':
      st=clone(S);m=st.matches.find(function(x){return x.id===ds.m});
      if(!m||m.status!=='done'||!undoable(st,m.table)||undoable(st,m.table).id!==m.id)return;
      var ids=[m.a,m.b];
      st.matches=st.matches.filter(function(x){return !(x.status==='live'&&x.n>m.n&&(ids.indexOf(x.a)>=0||ids.indexOf(x.b)>=0))});
      st.hold=st.hold||{};Object.keys(st.hold).forEach(function(t){if(ids.indexOf(st.hold[t])>=0)delete st.hold[t]});
      m.status='live';m.winner=null;m.endedSeq=null;m.endedAt=null;delete m.note;
      ui.last=null;
      commit(normalize(st));break;
    case 'stay':st=clone(S);st.stay=!stays(st);if(!st.stay)st.hold={};commit(normalize(st));break;
    case 'dStay':draft.stay=draft.stay===false;saveDraft();render();break;
    case 'unpick':ui.pending=null;ui.confirm=null;render();break;
    case 'win':
      if((S.race||1)>1&&ds.rl==null){ui.sheet={t:'race',id:ds.m,w:ds.w};render();return}
      st=clone(S);var m=st.matches.find(function(x){return x.id===ds.m});
      if(!m||m.status!=='live'){flash='That match was already scored.';render();return}
      m.status='done';m.winner=ds.w;m.rw=st.race||1;m.rl=Math.max(0,Math.min((st.race||1)-1,+ds.rl||0));st.endSeq=(st.endSeq||0)+1;m.endedSeq=st.endSeq;m.endedAt=Date.now();
      var dd=derive(st),Wp=dd.P[ds.w],Lp=dd.P[ds.w===m.a?m.b:m.a];
      if(stays(st)){st.hold=st.hold||{};st.hold[m.table]=ds.w}
      ui.last={w:Wp.name,wid:ds.w,l:Lp.name,table:m.table,left:Lp.cur,at:Date.now()};
      commit(normalize(st));break;
    case 'sheet':ui.sheet={t:ds.v,id:ds.id||null};render();break;
    case 'race':st=clone(S);st.race=Math.max(1,Math.min(9,(st.race||1)+(+ds.d)));commit(norm(st));break;
    case 'dType':draft.type=ds.v;if(ds.v==='de'&&(draft.race||1)<2)draft.race=3;saveDraft();render();break;
    case 'deWin':
      if((S.race||1)>1&&ds.rl==null){ui.sheet={t:'derace',id:ds.m,w:ds.w};render();return}
      st=clone(S);var D0=deCompute(st),dm=D0.by[ds.m];
      if(!dm||dm.state!=='ready'){flash='That match was already scored.';render();return}
      st.de.seq++;var asg=st.de.tables[ds.m];
      st.de.results[ds.m]={w:ds.w,rl:Math.max(0,Math.min((st.race||1)-1,+ds.rl||0)),seq:st.de.seq,table:asg?asg.t:0,at:Date.now()};
      var lid=dm.p1===ds.w?dm.p2:dm.p1,NM=deNameMap(),Lc=deRecord(st)[lid].l;

function setupError(){
  var names=draft.players.map(function(p){return p.name.trim().toLowerCase()});
  if(draft.players.length<2)return 'Add at least 2 players.';
  if(names.some(function(n){return !n}))return 'Every player needs a name.';
  var dup=names.find(function(n,i){return names.indexOf(n)!==i});
  if(dup)return 'Two players are both named "'+dup+'". Add an initial so they can be told apart.';
  return null;
}

  return s+'</span>';

/* ----- running ----- */
function undoable(st,t){
  var done=st.matches.filter(function(m){return m.status==='done'});
  var last=null;done.forEach(function(m){if(m.table===t&&(!last||m.endedSeq>last.endedSeq))last=m});
  if(!last)return null;
  var later=done.some(function(m){return m.endedSeq>last.endedSeq&&[m.a,m.b].some(function(id){return id===last.a||id===last.b})});
  return later?null:last;
}
function sw(act,on,label){return '<button class="switch'+(on?' on':'')+'" role="switch" aria-checked="'+on+'" aria-label="'+label+'" data-act="'+act+'"><i></i></button>'}
function tableGroups(d){

    var hi=flashOn(p,t),delay=hi?' style="animation-delay:-'+age+'ms"':'',isW=hold[t]===p.id||(m&&m.a===p.id&&p.lastOpp&&p.lastEnd>=0&&hi);

      var right='<span class="elapsed" data-t="'+m.startedAt+'">'+mins(m.startedAt)+'</span>'+undo+(can?'<button class="more" data-act="sheet" data-v="cancel" data-id="'+m.id+'" aria-label="More options for table '+t+'">•••</button>':'');
      out+=group('Table '+t,'<div class="list">'+cellFor(d.P[m.a],m,t,true)+cellFor(d.P[m.b],m,t,true)+'</div>',can&&t===1&&!ui.last?'Tap the player who won.':'',right);
    }else if(hold[t]&&d.P[hold[t]]){

  else body=historyHTML(d);
  var toast='',age=ui.last?Date.now()-ui.last.at:1e9;
  if(age<3000){var L=ui.last;toast='<div class="toast" role="status" style="animation-delay:-'+age+'ms"><span class="check">'+IC.check+'</span><div><b>'+h(L.w)+' won'+(stays(S)?' and stays on table '+L.table:'')+'</b><br><span>'+h(L.l)+(L.left>0?' has '+L.left+' chip'+(L.left===1?'':'s')+' left':' is out')+'</span></div></div>'}
  return header(sub)+hero+'<div class="tabs">'+seg('tab',tabsDef,tab,'big')+'</div>'+body+toast;
}

var lastTimer=null;
function render(){
  var html=S.phase==='setup'?renderSetup():renderRunning();
  var d=S.phase==='setup'?null:derive(S);
  root.innerHTML='<div class="wrap">'+html+'</div>'+(ui.sheet?sheetHTML(d||derive(S)):'')+(saving?'<div class="veil" aria-hidden="true"></div>':'');
  if(ui.last&&!lastTimer){var left=3000-(Date.now()-ui.last.at);
    if(left>0)lastTimer=setTimeout(function(){lastTimer=null;ui.last=null;if(!saving&&!ui.sheet)render();else{var r=root.querySelector('.toast');if(r)r.remove()}},left+50);else ui.last=null}
}

/* ---------- events ---------- */
root.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  if(saving)return;
  act(el.dataset.act,el);
});
root.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='d-title'){draft.title=t.value;saveDraft();var h1=root.querySelector('h1');if(h1)h1.textContent=t.value||'Pool Chip Tournament'}
  else if(t.dataset&&t.dataset.name){var p=draft.players.find(function(x){return x.id===t.dataset.name});if(p){p.name=t.value;draft.example=false;saveDraft()}}
});
root.addEventListener('change',function(e){
  var t=e.target;
  if(t.name==='pace'){draft.leadLimit=+t.value;saveDraft();render()}
  else if(t.id==='lead-sel'){if(!saving)act('lead',t)}
  else if(t.dataset&&t.dataset.tier){var tp=draft.players.find(function(x){return x.id===t.dataset.tier});if(tp){tp.tier=t.value;tp.manual=false;saveDraft();render()}}
  else if(t.dataset&&t.dataset.name){render()}
});
root.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&(e.target.id==='new-name'||e.target.id==='new-chips')){e.preventDefault();act('dAdd',e.target)}
  if(e.key==='Escape'&&ui.sheet){ui.sheet=null;render()}
});
window.addEventListener('hashchange',render);
setInterval(function(){root.querySelectorAll('.elapsed').forEach(function(el){el.textContent=mins(+el.dataset.t)})},30000);

/* ---------- boot ---------- */
function goLocal(){
  mode='local';
  ghPull().then(function(){render()},function(e){if(gh.token){sync.state='error';sync.msg=e.message;render()}});
  var ls=lsGet(LS_STATE);
  if(ls&&ls.v&&(ls.updatedAt||0)>(S.updatedAt||0))S=ls;
  render();
}
render();
(function(){
  var c=window.claude;
  if(!c||typeof c.use!=='function'){goLocal();return}
  Promise.resolve(c.use('artifact')).catch(function(){return null}).then(function(a){
    art=a;
    if(!art){goLocal();return}
    return Promise.resolve(c.use('user')).catch(function(){return null}).then(function(u){
      if(!u){mode='readonly';if(S.db&&S.db.players){DB=S.db;RC=null}render();return}
      return Promise.resolve(u.canEdit()).catch(function(){return null}).then(function(can){mode=can===false?'readonly':'shared';if(S.db&&S.db.players){DB=S.db;RC=null}render()});
    });
  });
})();
})();
</script>
